trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-nutricode-service-connection'
  webAppName: 'appservice-nutricode'

stages:
  - stage: CI
    displayName: 'CI - Build'
    jobs:
      - job: Build
        steps:
          - checkout: self

          - task: Maven@4
            displayName: 'Build com Maven'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package -DskipTests'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar JAR'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/target'
              artifact: 'drop'

  - stage: CD
    displayName: 'CD - Deploy'
    dependsOn: CI
    jobs:
      - job: Deploy
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Baixar artefato'
            inputs:
              artifact: 'drop'
              path: '$(Pipeline.Workspace)/drop'

          - task: AzureWebApp@1
            displayName: 'Deploy no Azure App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/*.jar'
